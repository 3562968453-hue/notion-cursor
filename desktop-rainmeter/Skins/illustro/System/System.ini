; ----------------------------------

[Rainmeter]
Update=1000
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,36,0,14

[Metadata]
Name=System
Author=poiru
Information=Displays basic system stats.
License=Creative Commons BY-NC-SA 3.0
Version=1.0.0

[Variables]
fontName=Segoe Script
textSize=12
colorBar=235,170,0,255
colorText=255,255,255,230
panelWidth=290

; ----------------------------------
; MEASURES
; ----------------------------------

[measureCPU]
Measure=CPU
Processor=0

[measureRAM]
Measure=PhysicalMemory
UpdateDivider=20

[measureSWAP]
Measure=SwapMemory
UpdateDivider=20

; ----------------------------------
; STYLES
; ----------------------------------

[styleTitle]
StringAlign=Center
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,60
FontColor=#colorText#
FontFace=#fontName#
FontSize=16
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Normal
StringEffect=Shadow
FontEffectColor=0,0,0,30
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=Right
StringCase=None
StringStyle=Normal
StringEffect=Shadow
FontEffectColor=0,0,0,30
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,18

; ----------------------------------
; METERS
; ----------------------------------

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=(#panelWidth# / 2)
Y=4
W=#panelWidth#
H=26
Text=System
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=Open Task Manager

[meterLabelCPU]
Meter=String
MeterStyle=styleLeftText
X=14
Y=42
W=160
H=20
Text=CPU Usage

[meterValueCPU]
Meter=String
MeterStyle=styleRightText
MeasureName=measureCPU
X=(#panelWidth# - 14)
Y=0r
W=100
H=20
Text=%1%

[meterBarCPU]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureCPU
X=14
Y=64
W=(#panelWidth# - 28)
H=2

[meterLabelRAM]
Meter=String
MeterStyle=styleLeftText
X=14
Y=76
W=160
H=20
Text=RAM Usage

[meterValueRAM]
Meter=String
MeterStyle=styleRightText
MeasureName=measureRAM
X=(#panelWidth# - 14)
Y=0r
W=100
H=20
Text=%1%
Percentual=1

[meterBarRAM]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureRAM
X=14
Y=98
W=(#panelWidth# - 28)
H=2

[meterLabelSWAP]
Meter=String
MeterStyle=styleLeftText
X=14
Y=110
W=160
H=20
Text=SWAP Usage

[meterValueSWAP]
Meter=String
MeterStyle=styleRightText
MeasureName=measureSWAP
X=(#panelWidth# - 14)
Y=0r
W=100
H=20
Text=%1%
Percentual=1

[meterBarSWAP]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureSWAP
X=14
Y=132
W=(#panelWidth# - 28)
H=2
