[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=周期表
Author=
Information=桌面悬浮图（滚轮缩放）
Version=1.1.0

[Variables]
; 缩放比例，1.0=原图大小
; 鼠标悬停在图上滚动滚轮：向上放大，向下缩小
Scale=0.5
ScaleStep=0.05
ScaleMin=0.15
ScaleMax=1.5

[MeterImage]
Meter=Image
ImageName=#@#PeriodicTable.png
W=(854 * #Scale#)
H=(546 * #Scale#)
AntiAlias=1
PreserveAspectRatio=1
DynamicVariables=1
MouseScrollUpAction=[!SetVariable Scale "(Clamp(#Scale#+#ScaleStep#,#ScaleMin#,#ScaleMax#))"][!WriteKeyValue Variables Scale "#Scale#"][!UpdateMeter MeterImage][!Redraw]
MouseScrollDownAction=[!SetVariable Scale "(Clamp(#Scale#-#ScaleStep#,#ScaleMin#,#ScaleMax#))"][!WriteKeyValue Variables Scale "#Scale#"][!UpdateMeter MeterImage][!Redraw]
ToolTipText=滚轮缩放 | 当前 #Scale#
